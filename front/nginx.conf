# Configuración completa de nginx para Crescendo (reemplaza /etc/nginx/nginx.conf).
# Corre como usuario no root: pid y temporales en /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

  # Login: ~5 intentos por minuto por IP; con burst=4 + nodelay pasan 5 seguidos y el 6.º recibe 429.
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_status 429;

  # DNS interno de Docker: resolver por petición evita IPs obsoletas si `api` se reinicia
  # y que nginx no arranque si `api` aún no existe.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad. Ninguna location usa add_header, así que todas las heredan.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    set $api_upstream http://api:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/auth/login {
      limit_req zone=login burst=4 nodelay;
      proxy_pass $api_upstream;
    }

    # Sin URI en proxy_pass: se conserva la ruta original (/api/v1/...).
    location /api/ {
      proxy_pass $api_upstream;
    }

    # Assets con hash en el nombre: caché larga.
    location /assets/ {
      expires max;
      try_files $uri =404;
    }

    location = /favicon.ico {
      access_log off;
      return 204;
    }

    # SPA: cualquier otra ruta sirve index.html, sin caché.
    location / {
      expires -1;
      try_files $uri /index.html;
    }
  }
}
