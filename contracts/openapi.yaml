openapi: 3.1.0
info:
  title: Crescendo API
  version: 0.6.1
  description: |
    Contrato de la API de Crescendo. Fuente de verdad compartida por Crescendo Back y Crescendo Front.
    Cualquier cambio se propone al orquestador (Crescendo) antes de aplicarse.

    Convenciones:
    - Prefijo de versión: /api/v1
    - JSON en camelCase.
    - Errores en formato RFC 9457 (application/problem+json).
    - Autenticación por cookie de sesión `crescendo_session` (HttpOnly; Secure; SameSite=Strict; Path=/).
    - Toda petición que modifica estado (POST/PUT/PATCH/DELETE) debe enviar `Content-Type: application/json`
      y, si trae cabecera `Origin`, ésta debe coincidir con el origen configurado (APP_ORIGIN). Si no, 403.
    - (v0.2) Montos, precios, cantidades y tasas viajan como **string decimal** (`Decimal`), nunca como número JSON.
      El front no calcula montos: los muestra tal como los entrega la API.
    - (v0.2) Fechas de negocio en `YYYY-MM-DD` (sin hora ni zona). Timestamps técnicos en ISO 8601 UTC.
    - (v0.2) Recursos de otro usuario se comportan como inexistentes (404 NOT_FOUND).
    - (v0.2) Listados: `limit` (1–500, default 100) y `offset` (default 0); respuesta `{ items, total }`.
    - (v0.3) Moneda de reporte: los endpoints que convierten aceptan `reportingCurrency`; si se omite, se usa la preferencia del usuario.
      Conversión: montos históricos (costo, aportes, dividendos cobrados, ganancia realizada) al tipo de cambio de **su fecha**;
      montos vigentes (saldos, costo "a tipo de cambio actual") al **último** tipo de cambio disponible.
      Tipo de cambio de una fecha = último publicado en o antes de esa fecha (fines de semana y feriados usan el día hábil anterior).
    - (v0.4) Precios: "precio actual" = última cotización guardada (proveedor o manual), con su `priceAsOf`. Precio de una fecha pasada =
      último cierre en o antes de esa fecha. Si una posición no tiene precio, sus campos de mercado son null y no suman en los totales
      (los totales informan `pricedCoverage`).
    - (v0.6) Dividendo por acción (DPA): siempre en la **moneda del instrumento** (nunca convertido). Si el dividendo no trae `perShare`,
      se deriva como bruto / cantidad en cartera (todas las cuentas del usuario) a `exDate` o, si no hay, a `paymentDate`.
      Un mismo pago (instrumento + fecha de pago) repartido en varias cuentas cuenta una vez: Σ bruto / Σ cantidad.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: catalog
  - name: accounts
  - name: trades
  - name: dividends
  - name: cash
  - name: portfolio
  - name: fx
  - name: preferences
  - name: market
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Estado de la API y de la base de datos
      security: []
      responses:
        '200':
          description: API y base de datos operativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: { status: ok, db: ok }
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: { status: degraded, db: down }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y entrega la cookie de sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Sesión creada
          headers:
            Set-Cookie:
              description: crescendo_session=<token>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=<SESSION_TTL>
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales inválidas (mensaje genérico, no revela si el email existe)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Unauthorized, status: 401, code: INVALID_CREDENTIALS, detail: Email o contraseña incorrectos }
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Demasiados intentos (lo aplica nginx)
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cierra la sesión actual y la invalida en el servidor
      requestBody:
        required: false
        description: Sin datos. El cliente envía `{}` con Content-Type application/json (requisito CSRF); el servidor acepta `{}` o cuerpo vacío.
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '204':
          description: Sesión cerrada; se envía Set-Cookie que expira la cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuario de la sesión actual
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────── Fase 1 ─────────────────────────────

  /markets:
    get:
      tags: [catalog]
      operationId: listMarkets
      summary: Mercados disponibles (catálogo global, sembrado por migración)
      responses:
        '200':
          description: Lista completa (sin paginar)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Market' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /instruments:
    get:
      tags: [catalog]
      operationId: listInstruments
      summary: Instrumentos del catálogo global
      parameters:
        - { name: q, in: query, description: Busca en símbolo y nombre (sin distinguir mayúsculas), schema: { type: string, maxLength: 50 } }
        - { name: marketCode, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de instrumentos ordenados por símbolo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [catalog]
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe ese símbolo en ese mercado (code CONFLICT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /instruments/{instrumentId}:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    get:
      tags: [catalog]
      operationId: getInstrument
      responses:
        '200':
          description: Instrumento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [catalog]
      operationId: updateInstrument
      description: Símbolo, mercado y moneda no se pueden cambiar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentUpdate' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Cuentas del usuario (sin paginar), con saldos de caja
      responses:
        '200':
          description: Cuentas ordenadas por nombre
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una cuenta con ese nombre (code CONFLICT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      operationId: getAccount
      responses:
        '200':
          description: Cuenta con saldos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [accounts]
      operationId: updateAccount
      description: La moneda base no se puede cambiar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nombre duplicado (code CONFLICT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /trades:
    get:
      tags: [trades]
      operationId: listTrades
      summary: Operaciones de compra/venta, más recientes primero
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/InstrumentIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: needsReview, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de operaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [trades]
      operationId: createTrade
      description: Crea la operación y, en la misma transacción, su movimiento de caja automático (TRADE).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /trades/{tradeId}:
    parameters:
      - $ref: '#/components/parameters/TradeId'
    get:
      tags: [trades]
      operationId: getTrade
      responses:
        '200':
          description: Operación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [trades]
      operationId: replaceTrade
      description: Reemplaza todos los campos; recalcula su movimiento de caja. Se rechaza si deja una posición negativa en cualquier fecha.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [trades]
      operationId: deleteTrade
      description: Elimina la operación y su movimiento de caja. Se rechaza si deja una posición negativa.
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /dividends:
    get:
      tags: [dividends]
      operationId: listDividends
      summary: Dividendos ordenados por fecha de pago descendente
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/InstrumentIdQuery'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DividendStatus' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de dividendos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DividendPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [dividends]
      operationId: createDividend
      description: |
        Registra un dividendo. Si `status` = PAID crea en la misma transacción un movimiento de caja DIVIDEND por el neto.
        Monto: se envía `grossAmount` **o** `perShare` (exactamente uno). Con `perShare`, la cantidad es `quantity` si viene,
        si no la posición de esa cuenta al cierre de `exDate` (o de `paymentDate` si no hay exDate); bruto = perShare × cantidad.
        Retención: `withholdingRate` si viene; si no, la del instrumento o, en su defecto, la del mercado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DividendInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dividend' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /dividends/summary:
    get:
      tags: [dividends]
      operationId: getDividendSummary
      summary: Dividendos de un año por instrumento y mes (equivalente a la tabla mensual del Excel)
      description: |
        `groups`: por moneda original. `reporting` (v0.3): todos los dividendos convertidos a la moneda de reporte al tipo de cambio
        de su fecha de pago (los ANNOUNCED con fecha futura usan el último disponible).
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: status, in: query, description: Si se omite incluye ambos, schema: { $ref: '#/components/schemas/DividendStatus' } }
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/ReportingCurrency'
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DividendSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dividends/{dividendId}:
    parameters:
      - $ref: '#/components/parameters/DividendId'
    get:
      tags: [dividends]
      operationId: getDividend
      responses:
        '200':
          description: Dividendo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dividend' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [dividends]
      operationId: replaceDividend
      description: Reemplaza todos los campos (mismas reglas que crear). Crea, actualiza o elimina su movimiento de caja según el nuevo status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DividendInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dividend' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [dividends]
      operationId: deleteDividend
      responses:
        '204': { description: Eliminado (junto con su movimiento de caja si existía) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dividends/{dividendId}/mark-paid:
    post:
      tags: [dividends]
      operationId: markDividendPaid
      summary: Atajo para pasar un dividendo ANNOUNCED a PAID (crea su movimiento de caja)
      parameters:
        - $ref: '#/components/parameters/DividendId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                paymentDate: { $ref: '#/components/schemas/Date' }
                netAmount: { $ref: '#/components/schemas/Decimal', description: Si el neto recibido difiere del calculado; se ajusta la retención (bruto se mantiene). }
      responses:
        '200':
          description: Dividendo pagado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dividend' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /cash-movements:
    get:
      tags: [cash]
      operationId: listCashMovements
      summary: Movimientos de caja (manuales y automáticos), más recientes primero
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - { name: currency, in: query, schema: { $ref: '#/components/schemas/Currency' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/CashMovementType' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashMovementPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [cash]
      operationId: createCashMovement
      description: Sólo tipos manuales DEPOSIT, WITHDRAWAL, FEE, INTEREST, ADJUSTMENT. Las transferencias/conversiones usan /cash-transfers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovementInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashMovement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cash-movements/{movementId}:
    parameters:
      - { name: movementId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [cash]
      operationId: deleteCashMovement
      description: |
        Sólo movimientos manuales. Los automáticos (TRADE, DIVIDEND) se eliminan borrando su operación/dividendo → 422 AUTOMATIC_MOVEMENT.
        Las patas de una transferencia se eliminan con DELETE /cash-transfers/{transferId} → 422 AUTOMATIC_MOVEMENT.
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /cash-transfers:
    post:
      tags: [cash]
      operationId: createCashTransfer
      summary: Transferencia entre cuentas propias y/o conversión de moneda
      description: |
        Crea dos movimientos enlazados: TRANSFER_OUT (negativo) en origen y TRANSFER_IN (positivo) en destino.
        Misma cuenta + distinta moneda = conversión (p. ej. CLP→USD en IB). Distinta cuenta = transferencia (con o sin conversión).
        No son aportes: no cuentan como capital aportado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashTransferInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashTransfer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /cash-transfers/{transferId}:
    delete:
      tags: [cash]
      operationId: deleteCashTransfer
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Eliminada (ambas patas) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /positions:
    get:
      tags: [portfolio]
      operationId: listPositions
      summary: Posiciones calculadas a partir de las operaciones y dividendos (no se guardan)
      description: |
        Costo promedio ponderado; las comisiones e impuestos de compra forman parte del costo.
        Una venta reduce cantidad y costo a costo promedio y genera ganancia realizada = neto de la venta − costo asignado.
        Valor de mercado y rentabilidad no realizada llegan en Fase 3.
      parameters:
        - { name: groupBy, in: query, schema: { type: string, enum: [instrument, account], default: instrument }, description: "instrument: una fila por instrumento (suma todas las cuentas); account: una fila por cuenta+instrumento" }
        - $ref: '#/components/parameters/AccountIdQuery'
        - { name: includeClosed, in: query, schema: { type: boolean, default: false }, description: Incluir posiciones con cantidad 0 }
        - { name: asOf, in: query, schema: { $ref: '#/components/schemas/Date' }, description: Fecha de corte (default hoy) }
        - $ref: '#/components/parameters/ReportingCurrency'
      responses:
        '200':
          description: Posiciones ordenadas por moneda y símbolo, con totales por moneda original y total en moneda de reporte
          content:
            application/json:
              schema:
                type: object
                required: [reportingCurrency, fxAsOf, items, totalsByCurrency, total]
                properties:
                  reportingCurrency: { $ref: '#/components/schemas/Currency' }
                  fxAsOf: { $ref: '#/components/schemas/Date', description: Fecha del último tipo de cambio usado como "actual" }
                  items: { type: array, items: { $ref: '#/components/schemas/Position' } }
                  totalsByCurrency:
                    type: array
                    description: Suma de las filas por moneda original (sin conversión)
                    items: { $ref: '#/components/schemas/PositionTotals' }
                  total: { $ref: '#/components/schemas/ReportingAmounts', description: Suma de `reporting` de todas las filas }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /portfolio/summary:
    get:
      tags: [portfolio]
      operationId: getPortfolioSummary
      summary: Indicadores consolidados en moneda de reporte (base del dashboard de Fase 4)
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
        - { name: asOf, in: query, schema: { $ref: '#/components/schemas/Date' }, description: Fecha de corte (default hoy) }
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /instruments/{instrumentId}/prices:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    get:
      tags: [market]
      operationId: listInstrumentPrices
      summary: Cierres diarios del instrumento, más antiguo primero
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Serie (máx. 4000 puntos)
          content:
            application/json:
              schema:
                type: object
                required: [instrumentId, currency, items]
                properties:
                  instrumentId: { type: string, format: uuid }
                  currency: { $ref: '#/components/schemas/Currency' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, close, source]
                      properties:
                        date: { $ref: '#/components/schemas/Date' }
                        close: { $ref: '#/components/schemas/Decimal' }
                        source: { type: string, enum: [PROVIDER, MANUAL] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [market]
      operationId: setManualPrice
      summary: Registra un precio manual (para instrumentos sin cobertura o para corregir)
      description: |
        Guarda/reemplaza el cierre de `date` con source MANUAL. Si `date` es el más reciente disponible, también pasa a ser la cotización actual.
        Un precio manual no se sobrescribe con el proveedor para esa fecha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, price]
              additionalProperties: false
              properties:
                date: { $ref: '#/components/schemas/Date' }
                price: { $ref: '#/components/schemas/Decimal', description: '> 0, en la moneda del instrumento' }
      responses:
        '200':
          description: Instrumento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /portfolio/history:
    get:
      tags: [portfolio]
      operationId: getPortfolioHistory
      summary: Serie histórica del portafolio en moneda de reporte (calculada, no almacenada)
      description: |
        Para cada fecha del intervalo: valor de mercado (cantidad al cierre del día × último cierre en o antes × TC del día), costo vigente,
        caja, capital aportado acumulado y dividendos netos acumulados, todo en moneda de reporte. Base de los gráficos de la Fase 4.
        Si un instrumento en cartera no tiene ningún precio en o antes de la fecha (p. ej. sin cobertura del proveedor), en la serie se
        valoriza a su costo promedio vigente (moneda original) para no subestimar el patrimonio; `unpricedAtCost` informa ese monto.
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Date' }, description: Default la primera operación del usuario }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Date' }, description: Default hoy }
        - { name: interval, in: query, schema: { type: string, enum: [day, week, month], default: day }, description: 'week/month: último día de cada periodo' }
      responses:
        '200':
          description: Serie (máx. 4000 puntos)
          content:
            application/json:
              schema:
                type: object
                required: [reportingCurrency, items]
                properties:
                  reportingCurrency: { $ref: '#/components/schemas/Currency' }
                  items: { type: array, items: { $ref: '#/components/schemas/PortfolioHistoryPoint' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /dividends/monthly:
    get:
      tags: [dividends]
      operationId: getDividendsMonthly
      summary: (v0.5) Dividendos por mes en moneda de reporte, para gráficos
      description: Un punto por mes calendario entre from y to (incluye meses en 0). Cada dividendo a TC de su fecha de pago.
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'YYYY-MM; default el mes del primer dividendo' }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'YYYY-MM; default el mes actual + 3 (para ver anunciados)' }
      responses:
        '200':
          description: Serie mensual y totales anuales
          content:
            application/json:
              schema:
                type: object
                required: [reportingCurrency, months, years]
                properties:
                  reportingCurrency: { $ref: '#/components/schemas/Currency' }
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, paidNet, paidGross, announcedNet, cumulativePaidNet]
                      properties:
                        month: { type: string, examples: ['2026-10'] }
                        paidNet: { $ref: '#/components/schemas/Decimal' }
                        paidGross: { $ref: '#/components/schemas/Decimal' }
                        announcedNet: { $ref: '#/components/schemas/Decimal' }
                        cumulativePaidNet: { $ref: '#/components/schemas/Decimal', description: Acumulado desde el primer dividendo }
                  years:
                    type: array
                    items:
                      type: object
                      required: [year, paidNet, paidGross, withholding, growth]
                      properties:
                        year: { type: integer }
                        paidNet: { $ref: '#/components/schemas/Decimal' }
                        paidGross: { $ref: '#/components/schemas/Decimal' }
                        withholding: { $ref: '#/components/schemas/Decimal', description: Retención en origen del año (útil para el crédito por impuesto extranjero) }
                        growth: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: 'paidNet / paidNet del año anterior − 1; null el primer año. El año en curso compara contra el mismo período (YTD) del año anterior.' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /dividends/calendar:
    get:
      tags: [dividends]
      operationId: getDividendCalendar
      summary: (v0.5) Calendario de los próximos 12 meses — anunciados + estimados
      description: |
        Anunciados: dividendos ANNOUNCED registrados. Estimados: para cada posición abierta, cada dividendo PAID de los últimos 12 meses
        se proyecta al mismo mes del año siguiente con el mismo monto por acción (o bruto × cantidad actual / cantidad de entonces) y la
        cantidad actual, salvo que ya exista un ANNOUNCED de ese instrumento en ese mes. Montos netos con la retención efectiva.
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
      responses:
        '200':
          description: Meses desde el actual, 12 en total
          content:
            application/json:
              schema:
                type: object
                required: [reportingCurrency, months, totalNet]
                properties:
                  reportingCurrency: { $ref: '#/components/schemas/Currency' }
                  totalNet: { $ref: '#/components/schemas/Decimal', description: Ingreso neto esperado en los 12 meses (reporte) }
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, totalNet, announcedNet, estimatedNet, items]
                      properties:
                        month: { type: string, examples: ['2026-11'] }
                        totalNet: { $ref: '#/components/schemas/Decimal' }
                        announcedNet: { $ref: '#/components/schemas/Decimal', description: (v0.5) Suma de ítems ANNOUNCED del mes (reporte) }
                        estimatedNet: { $ref: '#/components/schemas/Decimal', description: (v0.5) Suma de ítems ESTIMATED del mes (reporte) }
                        items:
                          type: array
                          items:
                            type: object
                            required: [instrumentId, symbol, status, date, currency, netAmount, netAmountReporting]
                            properties:
                              instrumentId: { type: string, format: uuid }
                              symbol: { type: string }
                              status: { type: string, enum: [ANNOUNCED, ESTIMATED] }
                              date: { $ref: '#/components/schemas/Date', description: Fecha de pago (estimada = misma fecha del año anterior) }
                              currency: { $ref: '#/components/schemas/Currency' }
                              netAmount: { $ref: '#/components/schemas/Decimal' }
                              netAmountReporting: { $ref: '#/components/schemas/Decimal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /dividends/per-share:
    get:
      tags: [dividends]
      operationId: getDividendsPerShare
      summary: (v0.6) P4 — Dividendo por acción, crecimiento y alertas de recorte por instrumento abierto
      description: |
        Una fila por instrumento con posición abierta (agregado entre cuentas). Sólo dividendos PAID. Ventanas por fecha de pago.
        - `years`: Σ DPA por año calendario (todos los tipos). `partial` = año en curso o año en que no se tuvo la posición completa
          (primera compra después del 1 de enero); `growth` sólo entre dos años no parciales consecutivos, si no null.
        - TTM = (hoy − 12 meses, hoy]; TTM anterior = (hoy − 24 meses, hoy − 12 meses]. Ambos **excluyen SPECIAL**.
          `ttmGrowth` = ttm / previousTtm − 1, sólo si la primera compra es anterior o igual al inicio del TTM anterior y previousTtm > 0; si no null.
        - `cagr` = (DPA último año no parcial / DPA primer año no parcial)^(1/(n−1)) − 1 con n ≥ 2 años no parciales; si no null.
        - `lastRegular` / `previousRegular`: los dos últimos pagos de tipo REGULAR (null si no hay). Un pago es `estimated` si su DPA es
          derivado, no tiene exDate y hubo compras o ventas del instrumento en los 45 días previos a la fecha de pago (la cantidad
          a la fecha de pago puede no ser la elegible en la fecha ex).
          (Si el DPA es derivado sin exDate pero la cantidad no cambió en esos 45 días, se considera confiable: `estimated` = false.)
        - `status` (se evalúa en este orden):
          1. SUSPENDED: previousTtm > 0 y ningún pago (no SPECIAL) en el TTM.
          2. CUT: ttmGrowth ≤ −umbral, o lastRegular / previousRegular − 1 ≤ −umbral **sólo si ninguno de los dos pagos es `estimated`**.
          3. INSUFFICIENT_DATA: ttmGrowth null.
          4. DOWN: ttmGrowth < 0. 5. STABLE: ttmGrowth ≤ 0.02. 6. GROWING: ttmGrowth > 0.02.
        - `cutReason`: TTM | LAST_REGULAR | null (si CUT por ambas, TTM).
        - `dataQuality`: EXACT (todos los pagos usados traen perShare), DERIVED (alguno derivado), PARTIAL (algún pago excluido por cantidad 0 a la fecha).
        Orden: status (SUSPENDED, CUT, DOWN, INSUFFICIENT_DATA, STABLE, GROWING) y luego symbol.
      parameters:
        - { name: cutThreshold, in: query, description: 'Fracción (0,1). Default la preferencia dividendCutThreshold', schema: { $ref: '#/components/schemas/Decimal' } }
      responses:
        '200':
          description: DPA por instrumento
          content:
            application/json:
              schema:
                type: object
                required: [asOf, cutThreshold, items]
                properties:
                  asOf: { $ref: '#/components/schemas/Date' }
                  cutThreshold: { $ref: '#/components/schemas/Decimal' }
                  items: { type: array, items: { $ref: '#/components/schemas/DividendPerShareRow' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dividends/year-over-year:
    get:
      tags: [dividends]
      operationId: getDividendsYearOverYear
      summary: (v0.6) Dividendos netos por mes calendario, un bloque por año, para comparar año contra año
      description: |
        Sin `currency`: todos los dividendos en moneda de reporte, cada uno a TC de su fecha de pago (como /dividends/monthly).
        Con `currency`: sólo dividendos de instrumentos en esa moneda, en esa moneda y sin conversión (aísla el efecto cambiario).
        Por mes: `paidNet` (PAID), `announcedNet` (ANNOUNCED), `ytdPaidNet` = Σ paidNet de enero a ese mes (null en meses posteriores
        al mes actual del año en curso), `growthVsPreviousYear` = paidNet / paidNet del mismo mes del año anterior − 1
        (null si ese mes del año anterior es 0, si el año anterior no está en el rango de datos o si el mes es posterior al actual).
        Por año: `totalPaidNet` y `growth` (como `years[].growth` de /dividends/monthly: el año en curso contra el mismo período del anterior).
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
        - { name: currency, in: query, description: 'Moneda original a filtrar (sin conversión)', schema: { $ref: '#/components/schemas/Currency' } }
        - { name: years, in: query, description: 'Años separados por coma, máx. 6; se respetan aunque estén en 0. Default: los 3 últimos de availableYears (puede ser menos de 3)', schema: { type: string, pattern: '^\d{4}(,\d{4}){0,5}$' } }
      responses:
        '200':
          description: Bloques anuales en orden ascendente
          content:
            application/json:
              schema:
                type: object
                required: [amountCurrency, converted, availableYears, years]
                properties:
                  amountCurrency: { $ref: '#/components/schemas/Currency', description: Moneda de todos los montos }
                  converted: { type: boolean, description: true = moneda de reporte con conversión; false = moneda original filtrada }
                  availableYears: { type: array, items: { type: integer }, description: Años con algún dividendo (para el selector) }
                  years:
                    type: array
                    items:
                      type: object
                      required: [year, totalPaidNet, totalAnnouncedNet, growth, months]
                      properties:
                        year: { type: integer }
                        totalPaidNet: { $ref: '#/components/schemas/Decimal' }
                        totalAnnouncedNet: { $ref: '#/components/schemas/Decimal' }
                        growth: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
                        months:
                          type: array
                          minItems: 12
                          maxItems: 12
                          items:
                            type: object
                            required: [month, paidNet, announcedNet, ytdPaidNet, growthVsPreviousYear]
                            properties:
                              month: { type: integer, minimum: 1, maximum: 12 }
                              paidNet: { $ref: '#/components/schemas/Decimal' }
                              announcedNet: { $ref: '#/components/schemas/Decimal' }
                              ytdPaidNet: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
                              growthVsPreviousYear: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /portfolio/allocation:
    get:
      tags: [portfolio]
      operationId: getPortfolioAllocation
      summary: (v0.5) Distribución del valor de mercado de las posiciones abiertas
      parameters:
        - { name: by, in: query, required: true, schema: { type: string, enum: [instrument, sector, market, currency, account, type] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'Si hay más grupos que limit, devuelve los primeros limit y un ítem final agregado con key "__others" y label "Otros (N)"' }
        - $ref: '#/components/parameters/ReportingCurrency'
      responses:
        '200':
          description: Grupos ordenados por valor descendente; posiciones sin precio van a su costo y se marcan
          content:
            application/json:
              schema:
                type: object
                required: [by, reportingCurrency, total, items]
                properties:
                  by: { type: string }
                  reportingCurrency: { $ref: '#/components/schemas/Currency' }
                  total: { $ref: '#/components/schemas/Decimal' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, value, weight, expectedAnnualIncomeGross, incomeWeight, valuedAtCost]
                      properties:
                        key: { type: string }
                        label: { type: string, description: 'Ej. "Energy", "Bolsa de Santiago", "USD", "Sin sector"' }
                        value: { $ref: '#/components/schemas/Decimal' }
                        weight: { $ref: '#/components/schemas/Decimal', description: Fracción 0–1 del valor }
                        expectedAnnualIncomeGross: { $ref: '#/components/schemas/Decimal' }
                        incomeWeight: { $ref: '#/components/schemas/Decimal', description: Fracción 0–1 del ingreso esperado (concentración de la renta) }
                        valuedAtCost: { $ref: '#/components/schemas/Decimal', description: Parte valorizada al costo por falta de precio }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /projections/snowball:
    get:
      tags: [portfolio]
      operationId: getSnowballProjection
      summary: (v0.5) P1 — proyección "bola de nieve" del patrimonio y del ingreso por dividendos
      description: |
        Simulación determinista mes a mes desde hoy, en moneda de reporte y en valores nominales.
        Punto de partida: patrimonio actual (netWorth) y yield neto actual (expectedAnnualNet / marketValue).
        Cada mes: + aporte; dividendos = valor invertido × yield neto / 12 (se reinvierten si reinvestDividends, si no se acumulan aparte);
        el valor invertido crece a priceGrowth anual; el dividendo por acción crece a dividendGrowth anual
        (por eso el yield sobre el precio cambia en (1+dividendGrowth)/(1+priceGrowth) por año); el aporte crece a contributionGrowth anual.
        Es una ilustración con supuestos constantes, no una predicción.
      parameters:
        - $ref: '#/components/parameters/ReportingCurrency'
        - { name: years, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: monthlyContribution, in: query, schema: { $ref: '#/components/schemas/Decimal' }, description: 'En moneda de reporte, >= 0. Default: promedio mensual de DEPOSIT − WITHDRAWAL de los últimos 12 meses (excluye los de source IMPORT tipo "no asignado")' }
        - { name: contributionGrowth, in: query, schema: { $ref: '#/components/schemas/Decimal' }, description: 'Fracción anual, default "0"' }
        - { name: reinvestDividends, in: query, schema: { type: boolean, default: true } }
        - { name: dividendGrowth, in: query, schema: { $ref: '#/components/schemas/Decimal' }, description: 'Fracción anual (-0.5 a 0.5), default "0.05"' }
        - { name: priceGrowth, in: query, schema: { $ref: '#/components/schemas/Decimal' }, description: 'Fracción anual (-0.5 a 0.5), default "0.04"' }
      responses:
        '200':
          description: Proyección anual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnowballProjection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /fx-rates:
    get:
      tags: [fx]
      operationId: listFxRates
      summary: Serie histórica de un par, más antigua primero
      description: Se puede pedir cualquier par entre CLP, USD, EUR y CLF (UF); los cruces se derivan vía CLP.
      parameters:
        - { name: base, in: query, required: true, schema: { $ref: '#/components/schemas/FxCurrency' } }
        - { name: quote, in: query, required: true, schema: { $ref: '#/components/schemas/FxCurrency' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Serie (sólo días con publicación; máx. 4000 puntos)
          content:
            application/json:
              schema:
                type: object
                required: [base, quote, items]
                properties:
                  base: { $ref: '#/components/schemas/FxCurrency' }
                  quote: { $ref: '#/components/schemas/FxCurrency' }
                  items: { type: array, items: { $ref: '#/components/schemas/FxPoint' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /fx-rates/latest:
    get:
      tags: [fx]
      operationId: getLatestFxRates
      summary: Último tipo de cambio de los pares de referencia (USD/CLP, EUR/CLP, EUR/USD, CLF/CLP)
      responses:
        '200':
          description: Últimos valores
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FxRate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      responses:
        '200':
          description: Preferencias del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [preferences]
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                reportingCurrency: { $ref: '#/components/schemas/Currency' }
                monthlyIncomeGoal: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: '(v0.5) Gasto mensual objetivo a cubrir con dividendos; null lo elimina. amount > 0.' }
                dividendCutThreshold: { $ref: '#/components/schemas/Decimal', description: '(v0.6) Fracción 0 < x < 1 (p. ej. "0.10"); fuera de rango → 400' }
      responses:
        '200':
          description: Actualizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crescendo_session
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    From: { name: from, in: query, description: Fecha mínima inclusiva, schema: { $ref: '#/components/schemas/Date' } }
    To: { name: to, in: query, description: Fecha máxima inclusiva, schema: { $ref: '#/components/schemas/Date' } }
    AccountIdQuery: { name: accountId, in: query, schema: { type: string, format: uuid } }
    InstrumentIdQuery: { name: instrumentId, in: query, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    InstrumentId: { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
    TradeId: { name: tradeId, in: path, required: true, schema: { type: string, format: uuid } }
    DividendId: { name: dividendId, in: path, required: true, schema: { type: string, format: uuid } }
    ReportingCurrency: { name: reportingCurrency, in: query, description: Default la preferencia del usuario, schema: { $ref: '#/components/schemas/Currency' } }
  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, down] }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }

    # ── Tipos base (Fase 1) ──
    Decimal:
      type: string
      pattern: '^-?\d{1,18}(\.\d{1,10})?$'
      description: Número decimal exacto como string. Ej. "1234.5", "-0.15", "331.794".
      examples: ['1234.56']
    Date:
      type: string
      format: date
      description: Fecha de negocio YYYY-MM-DD
    Currency:
      type: string
      enum: [CLP, USD, EUR]
      description: ISO 4217. Se amplía por contrato cuando haga falta.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency' }

    # ── Catálogo ──
    Market:
      type: object
      required: [code, name, country, currency, timezone, defaultWithholdingRate]
      properties:
        code: { type: string, description: 'Código MIC ISO 10383, salvo "US" que agrupa las bolsas de EE.UU.', examples: [XSGO] }
        name: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2, examples: [CL] }
        currency: { $ref: '#/components/schemas/Currency' }
        timezone: { type: string, examples: [America/Santiago] }
        defaultWithholdingRate: { $ref: '#/components/schemas/Decimal', description: 'Retención en origen sobre dividendos, fracción 0–1. CL "0", US "0.15".' }
    InstrumentType:
      type: string
      enum: [STOCK, ETF, FUND, REIT]
    Instrument:
      type: object
      required: [id, symbol, marketCode, name, type, currency, sector, industry, withholdingRate, effectiveWithholdingRate, annualDividendPerShare, priceSymbol, effectivePriceSymbol, lastPrice]
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string, examples: [PEHUENCHE] }
        marketCode: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/InstrumentType' }
        currency: { $ref: '#/components/schemas/Currency' }
        sector: { type: [string, 'null'] }
        industry: { type: [string, 'null'] }
        withholdingRate: { description: Override de retención; null = usa la del mercado, oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        effectiveWithholdingRate: { $ref: '#/components/schemas/Decimal' }
        annualDividendPerShare: { description: Dividendo anual esperado por acción (manual, moneda del instrumento), oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        priceSymbol: { type: [string, 'null'], description: '(v0.4) Override del símbolo en el proveedor de precios; null = derivado' }
        effectivePriceSymbol: { type: [string, 'null'], description: '(v0.4) Símbolo usado con el proveedor (XSGO → "<SYMBOL>.SN", US → símbolo con "." reemplazado por "-"); null = sin cobertura (sólo precio manual)' }
        lastPrice: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }] }
    InstrumentCreate:
      type: object
      required: [symbol, marketCode, name, type]
      additionalProperties: false
      properties:
        symbol: { type: string, pattern: '^[A-Z0-9.\-]{1,20}$', description: Se normaliza a mayúsculas }
        marketCode: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/InstrumentType' }
        currency: { $ref: '#/components/schemas/Currency', description: Default la moneda del mercado }
        sector: { type: [string, 'null'], maxLength: 60 }
        industry: { type: [string, 'null'], maxLength: 60 }
        withholdingRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        annualDividendPerShare: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        priceSymbol: { type: [string, 'null'], maxLength: 30 }
    InstrumentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/InstrumentType' }
        sector: { type: [string, 'null'], maxLength: 60 }
        industry: { type: [string, 'null'], maxLength: 60 }
        withholdingRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        annualDividendPerShare: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        priceSymbol: { type: [string, 'null'], maxLength: 30, description: Al cambiarlo, el worker vuelve a cargar historia y cotización }
    InstrumentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
        total: { type: integer }

    # ── Cuentas y caja ──
    Account:
      type: object
      required: [id, name, broker, baseCurrency, archived, cashBalances]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Itaú Corredores] }
        broker: { type: string, examples: [Itaú] }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        archived: { type: boolean }
        cashBalances:
          type: array
          description: Un saldo por cada moneda con movimientos (incluye la base aunque sea 0)
          items: { $ref: '#/components/schemas/Money' }
    AccountCreate:
      type: object
      required: [name, broker, baseCurrency]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        broker: { type: string, minLength: 1, maxLength: 60 }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        broker: { type: string, minLength: 1, maxLength: 60 }
        archived: { type: boolean }
    CashMovementType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, FEE, INTEREST, ADJUSTMENT, TRADE, DIVIDEND, TRANSFER_IN, TRANSFER_OUT]
      description: |
        Manuales: DEPOSIT, WITHDRAWAL (aportes/retiros de capital externos), FEE, INTEREST, ADJUSTMENT.
        Automáticos: TRADE (de una operación), DIVIDEND (de un dividendo PAID), TRANSFER_IN/OUT (de /cash-transfers).
    CashMovement:
      type: object
      required: [id, accountId, date, type, amount, currency, description, source, importRole, tradeId, dividendId, transferId]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/Date' }
        type: { $ref: '#/components/schemas/CashMovementType' }
        amount: { $ref: '#/components/schemas/Decimal', description: Con signo; positivo entra caja }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: [string, 'null'] }
        source: { type: string, enum: [MANUAL, AUTOMATIC, IMPORT], description: IMPORT = creado por la importación inicial (p. ej. aportes inferidos) }
        importRole:
          type: [string, 'null']
          enum: [INFERRED_CONTRIBUTION, UNASSIGNED_DEPOSIT, RESIDUAL_ADJUSTMENT, null]
          description: |
            (v0.6) Sólo lectura; no null sólo si source = IMPORT. INFERRED_CONTRIBUTION = aporte inferido para que la caja no quede negativa;
            UNASSIGNED_DEPOSIT = residuo depositado y no gastado al corte (no cuenta como aporte del período en la proyección);
            RESIDUAL_ADJUSTMENT = ajuste negativo al corte.
        tradeId: { type: [string, 'null'], format: uuid }
        dividendId: { type: [string, 'null'], format: uuid }
        transferId: { type: [string, 'null'], format: uuid }
    CashMovementInput:
      type: object
      required: [accountId, date, type, amount, currency]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/Date' }
        type: { type: string, enum: [DEPOSIT, WITHDRAWAL, FEE, INTEREST, ADJUSTMENT] }
        amount: { $ref: '#/components/schemas/Decimal', description: 'Positivo. El signo lo define el tipo (WITHDRAWAL y FEE restan; ADJUSTMENT acepta signo)' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: [string, 'null'], maxLength: 200 }
    CashMovementPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CashMovement' } }
        total: { type: integer }
    CashTransferInput:
      type: object
      required: [date, fromAccountId, fromAmount, fromCurrency, toAccountId, toAmount, toCurrency]
      additionalProperties: false
      properties:
        date: { $ref: '#/components/schemas/Date' }
        fromAccountId: { type: string, format: uuid }
        fromAmount: { $ref: '#/components/schemas/Decimal', description: Positivo }
        fromCurrency: { $ref: '#/components/schemas/Currency' }
        toAccountId: { type: string, format: uuid }
        toAmount: { $ref: '#/components/schemas/Decimal', description: Positivo }
        toCurrency: { $ref: '#/components/schemas/Currency' }
        description: { type: [string, 'null'], maxLength: 200 }
    CashTransfer:
      type: object
      required: [id, date, out, in, rate]
      properties:
        id: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/Date' }
        out: { $ref: '#/components/schemas/CashMovement' }
        in: { $ref: '#/components/schemas/CashMovement' }
        rate: { $ref: '#/components/schemas/Decimal', description: toAmount / fromAmount (1 si es la misma moneda) }

    # ── Operaciones ──
    TradeSide:
      type: string
      enum: [BUY, SELL]
    TradeInput:
      type: object
      required: [accountId, instrumentId, side, tradeDate, quantity, price]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        side: { $ref: '#/components/schemas/TradeSide' }
        tradeDate: { $ref: '#/components/schemas/Date' }
        quantity: { $ref: '#/components/schemas/Decimal', description: '> 0; admite fracciones' }
        price: { $ref: '#/components/schemas/Decimal', description: '> 0, por unidad, en la moneda del instrumento' }
        commission: { $ref: '#/components/schemas/Decimal', description: '>= 0, default "0"' }
        commissionTax: { $ref: '#/components/schemas/Decimal', description: '>= 0, monto (no tasa) del impuesto sobre la comisión (IVA en Chile), default "0"' }
        needsReview: { type: boolean, default: false, description: Marca de dato incompleto/aproximado que el usuario debe revisar (p. ej. ventas importadas al costo) }
        notes: { type: [string, 'null'], maxLength: 200 }
    Trade:
      type: object
      required: [id, accountId, instrumentId, symbol, side, tradeDate, quantity, price, commission, commissionTax, currency, grossAmount, total, needsReview, notes]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/TradeSide' }
        tradeDate: { $ref: '#/components/schemas/Date' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        commission: { $ref: '#/components/schemas/Decimal' }
        commissionTax: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency', description: La del instrumento }
        grossAmount: { $ref: '#/components/schemas/Decimal', description: quantity × price }
        total: { $ref: '#/components/schemas/Decimal', description: 'BUY: bruto + comisión + impuesto (sale de caja). SELL: bruto − comisión − impuesto (entra a caja).' }
        needsReview: { type: boolean }
        notes: { type: [string, 'null'] }
    TradePage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Trade' } }
        total: { type: integer }

    # ── Dividendos ──
    DividendStatus:
      type: string
      enum: [ANNOUNCED, PAID]
    DividendKind:
      type: string
      enum: [REGULAR, PROVISIONAL, FINAL, ADDITIONAL, SPECIAL, OTHER]
      description: 'Chile: PROVISIONAL (provisorio), FINAL (definitivo), ADDITIONAL (adicional/eventual). EE.UU./Europa: REGULAR, SPECIAL. OTHER = sin clasificar.'
    DividendInput:
      type: object
      required: [accountId, instrumentId, status, kind, paymentDate]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DividendStatus' }
        kind: { $ref: '#/components/schemas/DividendKind' }
        exDate: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        paymentDate: { $ref: '#/components/schemas/Date' }
        grossAmount: { $ref: '#/components/schemas/Decimal', description: Excluyente con perShare }
        perShare: { $ref: '#/components/schemas/Decimal', description: Excluyente con grossAmount }
        quantity: { $ref: '#/components/schemas/Decimal', description: Sólo junto a perShare; si falta se usa la posición }
        withholdingRate: { $ref: '#/components/schemas/Decimal', description: 'Fracción 0–1; default la efectiva del instrumento' }
        netAmount: { $ref: '#/components/schemas/Decimal', description: 'Opcional (v0.2.1). Neto efectivamente recibido. Si viene: retención = bruto − neto (sin redondear) y se conserva la tasa nominal, igual que mark-paid. Debe cumplir 0 ≤ neto ≤ bruto; si no, 400. Si no viene, retención = round(bruto × tasa).' }
        notes: { type: [string, 'null'], maxLength: 200 }
    Dividend:
      type: object
      required: [id, accountId, instrumentId, symbol, status, kind, exDate, paymentDate, currency, perShare, quantity, grossAmount, withholdingRate, withholdingAmount, netAmount, cashMovementId, notes]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        symbol: { type: string }
        status: { $ref: '#/components/schemas/DividendStatus' }
        kind: { $ref: '#/components/schemas/DividendKind' }
        exDate: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        paymentDate: { $ref: '#/components/schemas/Date' }
        currency: { $ref: '#/components/schemas/Currency', description: La del instrumento }
        perShare: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        quantity: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        grossAmount: { $ref: '#/components/schemas/Decimal' }
        withholdingRate: { $ref: '#/components/schemas/Decimal' }
        withholdingAmount: { $ref: '#/components/schemas/Decimal', description: 'bruto × tasa, redondeado a la moneda (CLP 0 decimales, USD/EUR 2)' }
        netAmount: { $ref: '#/components/schemas/Decimal', description: bruto − retención }
        cashMovementId: { type: [string, 'null'], format: uuid, description: Sólo si PAID }
        notes: { type: [string, 'null'] }
    DividendPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Dividend' } }
        total: { type: integer }
    DividendSummary:
      type: object
      required: [year, groups, reporting]
      properties:
        year: { type: integer }
        reporting:
          type: object
          required: [currency, monthlyGross, monthlyNet, totalGross, totalNet]
          properties:
            currency: { $ref: '#/components/schemas/Currency' }
            monthlyGross: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' } }
            monthlyNet: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' } }
            totalGross: { $ref: '#/components/schemas/Decimal' }
            totalNet: { $ref: '#/components/schemas/Decimal' }
        groups:
          type: array
          description: Un grupo por moneda
          items:
            type: object
            required: [currency, rows, monthlyGross, monthlyNet, totalGross, totalNet]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              rows:
                type: array
                items:
                  type: object
                  required: [instrumentId, symbol, monthlyGross, monthlyNet, totalGross, totalNet]
                  properties:
                    instrumentId: { type: string, format: uuid }
                    symbol: { type: string }
                    monthlyGross: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' }, description: Índice 0 = enero }
                    monthlyNet: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' } }
                    totalGross: { $ref: '#/components/schemas/Decimal' }
                    totalNet: { $ref: '#/components/schemas/Decimal' }
              monthlyGross: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' } }
              monthlyNet: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/Decimal' } }
              totalGross: { $ref: '#/components/schemas/Decimal' }
              totalNet: { $ref: '#/components/schemas/Decimal' }

    # ── Portafolio ──
    Position:
      type: object
      required: [accountId, instrumentId, symbol, name, marketCode, type, sector, currency, quantity, averageCost, costBasis, realizedGain, dividendsGross, dividendsNet, annualDividendPerShare, expectedAnnualIncomeGross, yieldOnCost, firstTradeDate, paymentMonths, reporting, priceDate, priceIsIntraday, positionReturn]
      properties:
        accountId: { type: [string, 'null'], format: uuid, description: null cuando groupBy=instrument }
        instrumentId: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        marketCode: { type: string }
        type: { $ref: '#/components/schemas/InstrumentType' }
        sector: { type: [string, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        averageCost: { $ref: '#/components/schemas/Decimal', description: Costo por unidad incluyendo comisiones }
        costBasis: { $ref: '#/components/schemas/Decimal', description: quantity × averageCost (monto invertido vigente) }
        realizedGain: { $ref: '#/components/schemas/Decimal', description: Acumulada por ventas }
        dividendsGross: { $ref: '#/components/schemas/Decimal', description: Dividendos PAID cobrados (histórico total) }
        dividendsNet: { $ref: '#/components/schemas/Decimal' }
        annualDividendPerShare: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        expectedAnnualIncomeGross: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: quantity × annualDividendPerShare }
        yieldOnCost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: annualDividendPerShare / averageCost, fracción }
        firstTradeDate: { $ref: '#/components/schemas/Date' }
        paymentMonths: { type: array, items: { type: integer, minimum: 1, maximum: 12 }, description: Meses con dividendos PAID en los últimos 12 meses (equivale a "Meses de pago" del Excel) }
        reporting: { $ref: '#/components/schemas/ReportingAmounts' }
        marketPrice: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: '(v0.4) Moneda del instrumento' }
        priceAsOf: { type: [string, 'null'], format: date-time }
        priceDate: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '(v0.5) Fecha de negocio del precio' }
        priceIsIntraday: { type: boolean, description: '(v0.5) true si es una cotización intradía (mostrar hora); false si es un cierre o manual' }
        priceSource: { type: [string, 'null'], enum: [PROVIDER, MANUAL, null] }
        marketValue: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: quantity × marketPrice }
        unrealizedGain: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: marketValue − costBasis (moneda original) }
        unrealizedReturn: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: unrealizedGain / costBasis, fracción }
        totalReturn: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: (unrealizedGain + realizedGain + dividendsNet) / costo total comprado, fracción (equivale a "Rentabilidad" del Excel) }
        positionReturn: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: '(v0.6.1) Rentabilidad sólo de la posición, sin dividendos: (unrealizedGain + realizedGain) / costo total comprado, fracción. Mismo denominador que totalReturn, así que totalReturn − positionReturn = dividendsNet / costo total comprado. Null en los mismos casos que totalReturn.' }
        currentYield: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: annualDividendPerShare / marketPrice, fracción }
        dayChange: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Variación % del precio vs cierre anterior, fracción }
    PositionTotals:
      type: object
      required: [currency, costBasis, realizedGain, dividendsGross, dividendsNet, expectedAnnualIncomeGross, marketValue, unrealizedGain, pricedCoverage]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        costBasis: { $ref: '#/components/schemas/Decimal' }
        realizedGain: { $ref: '#/components/schemas/Decimal' }
        dividendsGross: { $ref: '#/components/schemas/Decimal' }
        dividendsNet: { $ref: '#/components/schemas/Decimal' }
        expectedAnnualIncomeGross: { $ref: '#/components/schemas/Decimal', description: Suma de las filas con dato (las null no suman) }
        marketValue: { $ref: '#/components/schemas/Decimal', description: (v0.4) Suma de filas con precio }
        unrealizedGain: { $ref: '#/components/schemas/Decimal' }
        pricedCoverage: { $ref: '#/components/schemas/Decimal', description: Fracción del costo vigente con precio disponible (1 = todas) }
    ReportingAmounts:
      type: object
      description: |
        Montos de una posición (o suma) en moneda de reporte. Si la moneda del instrumento = moneda de reporte, fxEffect = 0.
        Invariante: costBasisAtCurrentRate − costBasis = fxEffect.
        (v0.4) Con precio: marketValue − costBasis = unrealizedGain = priceEffect + fxEffect.
      required: [currency, costBasis, costBasisAtCurrentRate, fxEffect, realizedGain, dividendsNet, expectedAnnualIncomeGross, marketValue, priceEffect, unrealizedGain]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        costBasis: { $ref: '#/components/schemas/Decimal', description: Costo vigente a tipos de cambio históricos (de cada compra, descargado a costo promedio en moneda de reporte en las ventas) }
        costBasisAtCurrentRate: { $ref: '#/components/schemas/Decimal', description: costBasis en moneda original × tipo de cambio actual }
        fxEffect: { $ref: '#/components/schemas/Decimal', description: Ganancia/pérdida sólo por tipo de cambio sobre el costo vigente }
        realizedGain: { $ref: '#/components/schemas/Decimal', description: Ventas a TC de la venta − costo descargado a TC histórico (incluye efecto cambiario realizado) }
        dividendsNet: { $ref: '#/components/schemas/Decimal', description: Dividendos PAID netos, cada uno a TC de su fecha de pago }
        expectedAnnualIncomeGross: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: A TC actual }
        marketValue: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: (v0.4) Valor de mercado (moneda original) × TC actual }
        priceEffect: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: (marketValue − costBasis en moneda original) × TC actual }
        unrealizedGain: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: marketValue − costBasis (reporte) = priceEffect + fxEffect }

    # ── Mercado (v0.4) ──
    Quote:
      type: object
      required: [price, currency, date, asOf, source, previousClose]
      properties:
        date: { $ref: '#/components/schemas/Date', description: '(v0.5) Fecha de negocio del precio en la zona del mercado' }
        price: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/Currency' }
        asOf: { type: string, format: date-time, description: Momento de la cotización según la fuente }
        source: { type: string, enum: [PROVIDER, MANUAL] }
        previousClose: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
    PortfolioHistoryPoint:
      type: object
      required: [date, marketValue, costBasis, cash, contributedCapital, dividendsNetCumulative, realizedGainCumulative, unpricedAtCost, netWorth, totalGain]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        marketValue: { $ref: '#/components/schemas/Decimal', description: Posiciones a precio y TC del día }
        costBasis: { $ref: '#/components/schemas/Decimal', description: Costo vigente a TC históricos }
        cash: { $ref: '#/components/schemas/Decimal', description: Caja a TC del día }
        contributedCapital: { $ref: '#/components/schemas/Decimal', description: Acumulado a la fecha }
        dividendsNetCumulative: { $ref: '#/components/schemas/Decimal', description: Dividendos PAID netos acumulados (a TC de cada pago) }
        realizedGainCumulative: { $ref: '#/components/schemas/Decimal' }
        unpricedAtCost: { $ref: '#/components/schemas/Decimal', description: Parte de marketValue valorizada al costo por falta de precio (0 si todo tiene precio) }
        netWorth: { $ref: '#/components/schemas/Decimal', description: '(v0.5) marketValue + cash' }
        totalGain: { $ref: '#/components/schemas/Decimal', description: '(v0.5) netWorth − contributedCapital' }

    SnowballProjection:
      type: object
      required: [reportingCurrency, assumptions, start, years, goalReachedYear]
      properties:
        reportingCurrency: { $ref: '#/components/schemas/Currency' }
        assumptions:
          type: object
          description: Valores efectivamente usados (incluye los defaults calculados)
          required: [years, monthlyContribution, contributionGrowth, reinvestDividends, dividendGrowth, priceGrowth, startYield]
          properties:
            years: { type: integer }
            monthlyContribution: { $ref: '#/components/schemas/Decimal' }
            contributionGrowth: { $ref: '#/components/schemas/Decimal' }
            reinvestDividends: { type: boolean }
            dividendGrowth: { $ref: '#/components/schemas/Decimal' }
            priceGrowth: { $ref: '#/components/schemas/Decimal' }
            startYield: { $ref: '#/components/schemas/Decimal', description: Yield neto inicial, fracción }
        start:
          type: object
          required: [netWorth, annualDividendsNet]
          properties:
            netWorth: { $ref: '#/components/schemas/Decimal' }
            annualDividendsNet: { $ref: '#/components/schemas/Decimal' }
        years:
          type: array
          description: Un punto por año (al cierre de cada año de proyección)
          items:
            type: object
            required: [year, calendarYear, contributedCumulative, netWorth, annualDividendsNet, monthlyDividendsNet, dividendsCumulative, goalCoverage]
            properties:
              year: { type: integer, description: '1..years' }
              calendarYear: { type: integer }
              contributedCumulative: { $ref: '#/components/schemas/Decimal', description: Aportes nuevos acumulados (sin el patrimonio inicial) }
              netWorth: { $ref: '#/components/schemas/Decimal', description: Incluye dividendos acumulados no reinvertidos }
              annualDividendsNet: { $ref: '#/components/schemas/Decimal', description: Dividendos netos de ese año }
              monthlyDividendsNet: { $ref: '#/components/schemas/Decimal', description: annualDividendsNet / 12 }
              dividendsCumulative: { $ref: '#/components/schemas/Decimal' }
              goalCoverage: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: 'monthlyDividendsNet / meta mensual (TC actual); null sin meta' }
        goalReachedYear: { type: [integer, 'null'], description: Primer calendarYear con goalCoverage >= 1; null si no se alcanza o no hay meta }

    # ── Moneda de reporte y tipos de cambio (v0.3) ──
    FxCurrency:
      type: string
      enum: [CLP, USD, EUR, CLF]
      description: Currency + CLF (Unidad de Fomento), sólo para tipos de cambio
    FxPoint:
      type: object
      required: [date, rate]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        rate: { $ref: '#/components/schemas/Decimal', description: 1 base = rate quote }
    FxRate:
      type: object
      required: [base, quote, date, rate, source]
      properties:
        base: { $ref: '#/components/schemas/FxCurrency' }
        quote: { $ref: '#/components/schemas/FxCurrency' }
        date: { $ref: '#/components/schemas/Date' }
        rate: { $ref: '#/components/schemas/Decimal' }
        source: { type: string, description: 'Ej. "mindicador:dolar" o "derived:CLP"' }
    Preferences:
      type: object
      required: [reportingCurrency, monthlyIncomeGoal, dividendCutThreshold]
      properties:
        reportingCurrency: { $ref: '#/components/schemas/Currency', description: Default USD }
        monthlyIncomeGoal: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: '(v0.5) P2: gasto mensual objetivo, en la moneda que el usuario elija' }
        dividendCutThreshold: { $ref: '#/components/schemas/Decimal', description: '(v0.6) P4: caída que se considera recorte, fracción. Default "0.10"' }
    DividendPerShareRow:
      type: object
      required: [instrumentId, symbol, name, currency, firstTradeDate, years, ttmPerShare, previousTtmPerShare, ttmGrowth, cagr, lastRegular, previousRegular, status, cutReason, dataQuality]
      properties:
        instrumentId: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        currency: { $ref: '#/components/schemas/Currency', description: La del instrumento; todos los DPA van en ella }
        firstTradeDate: { $ref: '#/components/schemas/Date' }
        years:
          type: array
          description: Ascendente, desde el primer año con dividendos PAID
          items:
            type: object
            required: [year, perShare, growth, partial]
            properties:
              year: { type: integer }
              perShare: { $ref: '#/components/schemas/Decimal' }
              growth: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
              partial: { type: boolean }
        ttmPerShare: { $ref: '#/components/schemas/Decimal' }
        previousTtmPerShare: { $ref: '#/components/schemas/Decimal' }
        ttmGrowth: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        cagr: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        lastRegular: { oneOf: [{ $ref: '#/components/schemas/DividendPerSharePayment' }, { type: 'null' }] }
        previousRegular: { oneOf: [{ $ref: '#/components/schemas/DividendPerSharePayment' }, { type: 'null' }] }
        status: { type: string, enum: [SUSPENDED, CUT, DOWN, INSUFFICIENT_DATA, STABLE, GROWING] }
        cutReason: { type: [string, 'null'], enum: [TTM, LAST_REGULAR, null] }
        dataQuality: { type: string, enum: [EXACT, DERIVED, PARTIAL] }
    DividendPerSharePayment:
      type: object
      required: [paymentDate, perShare, estimated]
      properties:
        paymentDate: { $ref: '#/components/schemas/Date' }
        perShare: { $ref: '#/components/schemas/Decimal' }
        estimated: { type: boolean, description: '(v0.6) true = DPA derivado poco confiable (ver /dividends/per-share); no dispara CUT por LAST_REGULAR' }
    PortfolioSummary:
      type: object
      required: [reportingCurrency, asOf, fxAsOf, contributedCapital, costBasis, costBasisAtCurrentRate, cash, fxEffect, realizedGain, dividends, exposure, marketValue, netWorth, priceEffect, unrealizedGain, totalGain, pricedCoverage, pricesAsOf, pricesDate, incomeGoal, dividendAlerts]
      properties:
        reportingCurrency: { $ref: '#/components/schemas/Currency' }
        asOf: { $ref: '#/components/schemas/Date' }
        fxAsOf: { $ref: '#/components/schemas/Date' }
        contributedCapital: { $ref: '#/components/schemas/Decimal', description: Σ DEPOSIT − Σ WITHDRAWAL, cada uno a TC de su fecha }
        costBasis: { $ref: '#/components/schemas/Decimal', description: Costo vigente de posiciones a TC históricos }
        costBasisAtCurrentRate: { $ref: '#/components/schemas/Decimal' }
        cash: { $ref: '#/components/schemas/Decimal', description: Saldos de caja a TC actual }
        fxEffect:
          type: object
          required: [positions, cash, total]
          properties:
            positions: { $ref: '#/components/schemas/Decimal' }
            cash: { $ref: '#/components/schemas/Decimal', description: Saldo a TC actual − Σ movimientos a TC de su fecha (caja en moneda distinta a la de reporte) }
            total: { $ref: '#/components/schemas/Decimal' }
        realizedGain: { $ref: '#/components/schemas/Decimal' }
        marketValue: { $ref: '#/components/schemas/Decimal', description: (v0.4) Posiciones con precio, a TC actual }
        netWorth: { $ref: '#/components/schemas/Decimal', description: marketValue + cash }
        priceEffect: { $ref: '#/components/schemas/Decimal' }
        unrealizedGain: { $ref: '#/components/schemas/Decimal', description: priceEffect + fxEffect.positions (sólo posiciones con precio) }
        totalGain: { $ref: '#/components/schemas/Decimal', description: netWorth − contributedCapital (ganancia total del patrimonio, incluye dividendos y efecto cambiario) }
        pricedCoverage: { $ref: '#/components/schemas/Decimal', description: Fracción del costo vigente con precio }
        pricesAsOf: { type: [string, 'null'], format: date-time, description: Cotización más antigua usada (para mostrar "precios al …") }
        pricesDate: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '(v0.5) Fecha de negocio de la cotización más antigua usada' }
        dividends:
          type: object
          required: [netYearToDate, netLast12Months, netTotal, expectedAnnualGross, expectedAnnualNet]
          properties:
            netYearToDate: { $ref: '#/components/schemas/Decimal' }
            netLast12Months: { $ref: '#/components/schemas/Decimal' }
            netTotal: { $ref: '#/components/schemas/Decimal' }
            expectedAnnualGross: { $ref: '#/components/schemas/Decimal', description: Σ quantity × annualDividendPerShare a TC actual }
            currentYield: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: (v0.4) expectedAnnualGross / marketValue, fracción }
            expectedAnnualNet: { $ref: '#/components/schemas/Decimal', description: '(v0.5) Σ cantidad × dividendo anual por acción × (1 − retención efectiva), a TC actual' }
        incomeGoal:
          description: (v0.5) P2. null si el usuario no definió meta.
          oneOf:
            - { type: 'null' }
            - type: object
              required: [goal, monthlyGoalReporting, coverageLast12Months, coverageExpected]
              properties:
                goal: { $ref: '#/components/schemas/Money', description: Tal como la definió el usuario }
                monthlyGoalReporting: { $ref: '#/components/schemas/Decimal', description: Meta mensual convertida a la moneda de reporte con TC actual }
                coverageLast12Months: { $ref: '#/components/schemas/Decimal', description: '(netLast12Months / 12) / monthlyGoalReporting, fracción (puede ser > 1)' }
                coverageExpected: { $ref: '#/components/schemas/Decimal', description: '(expectedAnnualNet / 12) / monthlyGoalReporting' }
        dividendAlerts:
          type: object
          description: (v0.6) P4. Conteo de instrumentos abiertos por estado de /dividends/per-share con el umbral de las preferencias
          required: [cut, suspended, down]
          properties:
            cut: { type: integer }
            suspended: { type: integer }
            down: { type: integer }
        exposure:
          type: array
          description: Distribución por moneda de (costo vigente a TC actual + caja); suma 1
          items:
            type: object
            required: [currency, amount, weight]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              amount: { $ref: '#/components/schemas/Decimal', description: En moneda de reporte }
              weight: { $ref: '#/components/schemas/Decimal', description: Fracción 0–1 }

    # ── Errores ──
    Problem:
      type: object
      description: RFC 9457 Problem Details + `code` estable para que el front decida.
      required: [type, title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE, INSUFFICIENT_POSITION, CURRENCY_MISMATCH, ACCOUNT_ARCHIVED, AUTOMATIC_MOVEMENT, NO_POSITION_FOR_DIVIDEND, INVALID_STATE, FX_RATE_UNAVAILABLE, INTERNAL_ERROR]
          description: |
            400 VALIDATION_ERROR · 401 INVALID_CREDENTIALS | UNAUTHENTICATED · 403 FORBIDDEN · 404 NOT_FOUND ·
            405 METHOD_NOT_ALLOWED (con cabecera Allow) · 409 CONFLICT · 413 PAYLOAD_TOO_LARGE · 500 INTERNAL_ERROR ·
            422 reglas de negocio:
              INSUFFICIENT_POSITION (venta/edición/borrado deja posición negativa en alguna fecha),
              CURRENCY_MISMATCH (moneda que no corresponde, p. ej. transferencia con moneda distinta de la indicada),
              ACCOUNT_ARCHIVED (movimientos nuevos en cuenta archivada),
              AUTOMATIC_MOVEMENT (borrar directamente un movimiento automático),
              NO_POSITION_FOR_DIVIDEND (perShare sin quantity y sin posición en la fecha),
              INVALID_STATE (p. ej. mark-paid sobre un dividendo ya PAID),
              FX_RATE_UNAVAILABLE (no hay tipo de cambio en o antes de la fecha requerida).
        errors:
          type: array
          description: Sólo en VALIDATION_ERROR
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    ValidationError:
      description: Cuerpo o parámetros inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Sin sesión o sesión expirada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Unauthorized, status: 401, code: UNAUTHENTICATED }
    Forbidden:
      description: Origin no permitido o Content-Type distinto de application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe o pertenece a otro usuario
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BusinessRule:
      description: Viola una regla de negocio (ver códigos 422 en Problem.code)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
security:
  - sessionCookie: []
